# THE PORT'S OWN BELT.
#
# Shaped like the Ezio belt's own record -- a garment on the inner-chest clothing base, the Camera
# suffix, iconic quality -- but the mesh behind it is the game's own NCPD duty belt, so no third-party
# mod has to be installed and no third-party archive has to be repacked.
#
#   entityName        the factory row in base\vrport\vrp_props.csv
#   appearanceName    the stem; the Camera suffix makes it "<stem>&Male&FPP" and friends, which is
#                     what the four appearances in vrp_belt.ent are named
#   placementSlots    the port's own waist slot (AttachmentSlots.VRPortWaist.yaml), NOT EquipmentEX's
#                     OutfitSlots.Waist: the belt needs no EquipmentEX, and with this slot last its
#                     wardrobe patches pass the item by, so its outfits can never hold a second belt
Items.vrp_belt:
  $base: Items.GenericInnerChestClothing
  placementSlots:
    - !append AttachmentSlots.VRPortWaist
  entityName: vrp_belt
  appearanceName: vrp_belt_
  quality: Quality.Legendary
  appearanceSuffixes:
    - !append itemsFactoryAppearanceSuffix.Camera
  statModifiers:
    - !append Quality.IconicItem
    - !append Character.ScaleToPlayerLevel
